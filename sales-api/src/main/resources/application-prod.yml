server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/sales_hub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: redis
      port: 6379
      database: 0
      timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:SalesHubJwtSecretKey2025ForTokenSigningMustBeLongEnough!!}
    expiration: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost}
  upload:
    dir: /app/uploads
    max-size-bytes: 2097152
