server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sales_hub?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:changeme}  # 本地开发请在环境变量或IDE中设置
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 生产环境请勿开启
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: SalesHubJwtSecretKey2025ForTokenSigningMustBeLongEnough!!  # 生产环境请使用环境变量: ${JWT_SECRET}
    expiration: 86400000  # 24 hours
  cors:
    allowed-origins: "http://localhost:5174,http://localhost:5173"  # 生产环境改为实际域名，如 https://yourdomain.com
  upload:
    dir: uploads
    max-size-bytes: 2097152  # 2MB 应用层限制
  site-url: http://localhost:5173
